[package]
name = "lesson_1"
version = "0.1.0"
edition = "2024"

[lib] 
name = "thread_help"
path = "src/thread_help.rs"

[dependencies]
inquire = "0.9.4"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.22.0"
chrono = "0.4.45"
lazy_static = "1.5.0"
d-web = "0.1.1"
futures = "0.3.33"
async-std = "1.13.2"
log = "0.4.33"
simple_logger = "5.2.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
tokio-stream = "0.1.19"
open = "5"
bcrypt = "0.19.3"
tokio-postgres = "0.7.18"
jsonwebtoken = "9.3.0"
tower-http = { version = "0.7.0", features = ["full"] }
tokio-util = "0.7.19"
axum_session = "0.21.0"
axum_session_sqlx = { version = "0.11.0", default-features = false, features = ["sqlite", "tls-rustls"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros"] }
axum_session_auth = "0.21.0"
async-trait = "0.1.92"
anyhow = "1.0.104"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
futures-util = "0.3.34"
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite","sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
[dev-dependencies]
pretty_assertions = "1"

